name: ci
on: [push, pull_request]

jobs:
  check:
    # pinned: Playwright 1.56 ships Chromium (and --with-deps packages) for Ubuntu 24.04, not for 26.04 that ubuntu-latest now is
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: psql "$TEST_DATABASE_ADMIN_URL" -c "create role erp_app login password 'erp_app' createdb"
      - run: pnpm install
      - run: pnpm check
      - name: mobile bundles for Android
        run: pnpm --filter @erp/mobile bundle:check
        env: { EXPO_OFFLINE: '1', CI: '1' }
      - name: browser tests (web app against a real installation)
        run: |
          pnpm exec playwright-core install --with-deps chromium
          pnpm test:ui
      - name: automated UAT run (all 77 cases, screenshots)
        run: pnpm exec vitest run --config vitest.uat.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: uat-screens, path: docs/uat/screens }
