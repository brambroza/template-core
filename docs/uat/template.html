<title>UAT ERP โรงงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column of UAT cases under a summary band; screenshots beside each case's steps on wide screens.
   Palette follows the ERP itself: steel ink, concrete, paper, safety-yellow floor tape. */
:root {
  --bg: #EEF0EC;
  --surface: #FFFFFF;
  --ink: #1F2A33;
  --ink-soft: #4A5762;
  --rule: #C9CEC7;
  --rule-soft: #E1E4DE;
  --signal: #F2C230;
  --signal-ink: #1F2A33;
  --band: #1F2A33;
  --band-ink: #F4F6F3;
  --band-soft: #A9B4BC;
  --ok: #2E7D5B;
  --ok-bg: #E3F1EA;
  --fail: #B83A2E;
  --fail-bg: #FBEDEB;
  --warn: #9A6208;
  --warn-bg: #FBF0DA;
  --idle: #6B7780;
  --idle-bg: #EEF0EC;
  --shadow: 0 10px 30px rgba(31, 42, 51, .35);
  --font: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Sarabun', 'Leelawadee UI', system-ui, sans-serif;
  --tape: repeating-linear-gradient(-45deg, var(--signal) 0 7px, #1F2A33 7px 14px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151C22; --surface: #1E272F; --ink: #E7ECEF; --ink-soft: #A9B4BC; --rule: #34414C; --rule-soft: #2A353F;
    --band: #0F1519; --band-ink: #F4F6F3; --band-soft: #8E9AA3;
    --ok: #6CC79E; --ok-bg: #18342A; --fail: #F08A7E; --fail-bg: #3A1F1C; --warn: #F2C26B; --warn-bg: #3A2E14; --idle: #A9B4BC; --idle-bg: #26313A;
    --shadow: 0 10px 30px rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151C22; --surface: #1E272F; --ink: #E7ECEF; --ink-soft: #A9B4BC; --rule: #34414C; --rule-soft: #2A353F;
  --band: #0F1519; --band-ink: #F4F6F3; --band-soft: #8E9AA3;
  --ok: #6CC79E; --ok-bg: #18342A; --fail: #F08A7E; --fail-bg: #3A1F1C; --warn: #F2C26B; --warn-bg: #3A2E14; --idle: #A9B4BC; --idle-bg: #26313A;
  --shadow: 0 10px 30px rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

/* header band */
.band { background: var(--band); color: var(--band-ink); }
.tape { height: 12px; background: var(--tape); }
.band-inner { padding-block: 28px 26px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr) auto; align-items: end; }
.band h1 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); font-weight: 700; }
.band .sub { color: var(--band-soft); margin: 6px 0 0; }
.verdict { text-align: right; }
.verdict .big { font-size: 2.6rem; font-weight: 700; line-height: 1; color: var(--signal); }
.verdict .lbl { color: var(--band-soft); font-size: .9rem; }

/* summary */
.summary { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); padding-block: 24px 8px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 18px 20px; min-width: 0; }
.panel h2 { font-size: 1.05rem; margin-bottom: 10px; }
.panel p { margin: 0 0 10px; color: var(--ink-soft); }
.areas { width: 100%; border-collapse: collapse; font-size: .9rem; }
.areas td { padding: 5px 0; border-top: 1px solid var(--rule-soft); }
.areas td:last-child { text-align: right; white-space: nowrap; }
.pass-n { color: var(--ok); font-weight: 600; }
.fail-n { color: var(--fail); font-weight: 600; }
.progress { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--idle-bg); margin: 8px 0 12px; }
.progress span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.conn { font-size: .85rem; color: var(--ink-soft); margin-top: 10px; }

/* sign-off */
.signoff { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule-soft); display: grid; gap: 8px; }
.signoff-state { font-weight: 600; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 18px 6px; align-items: center; }
.chip { font: inherit; font-size: .9rem; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters .sep { width: 1px; height: 22px; background: var(--rule); margin-inline: 4px; }

/* cases */
.cases { display: grid; gap: 16px; padding-block: 10px 60px; }
.case { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; scroll-margin-top: 16px; }
.case-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 16px 20px 12px; border-bottom: 1px solid var(--rule-soft); }
.case-id { font-weight: 700; font-variant-numeric: tabular-nums; background: var(--signal); color: var(--signal-ink); border-radius: 3px; padding: 1px 8px; font-size: .9rem; white-space: nowrap; }
.case-title { font-size: 1.08rem; font-weight: 600; }
.case-meta { color: var(--ink-soft); font-size: .88rem; margin-top: 2px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; border-radius: 3px; padding: 2px 10px; white-space: nowrap; }
.badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.b-pass { color: var(--ok); background: var(--ok-bg); }
.b-fail { color: var(--fail); background: var(--fail-bg); }
.b-blocked { color: var(--warn); background: var(--warn-bg); }
.b-idle { color: var(--idle); background: var(--idle-bg); }
.case-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; padding: 16px 20px; }
.case-body h3 { font-size: .85rem; font-weight: 600; color: var(--ink-soft); margin: 0 0 4px; }
.case-body ol, .case-body ul { margin: 0 0 14px; padding-left: 22px; }
.case-body li { margin-bottom: 3px; }
.auto { font-size: .88rem; color: var(--ink-soft); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; }
.shot { padding: 0; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg); cursor: zoom-in; overflow: hidden; display: grid; }
.shot img { width: 100%; height: 120px; object-fit: cover; object-position: top left; display: block; }
.shot.phone img { object-position: top center; }
.shot span { font-size: .78rem; color: var(--ink-soft); padding: 3px 8px; text-align: left; }

/* tester verdict */
.verdict-row { border-top: 1px solid var(--rule-soft); padding: 14px 20px 16px; display: grid; gap: 10px; background: color-mix(in srgb, var(--bg) 45%, var(--surface)); }
.vbtns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vbtn { font: inherit; font-size: .92rem; font-weight: 600; border-radius: 4px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); min-height: 38px; }
.vbtn[data-v="pass"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.vbtn[data-v="fail"][aria-pressed="true"] { background: var(--fail); border-color: var(--fail); color: #fff; }
.vbtn[data-v="blocked"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.vbtn:disabled { opacity: .55; cursor: not-allowed; }
textarea { font: inherit; width: 100%; min-height: 60px; border: 1px solid var(--rule); border-radius: 4px; padding: 8px 10px; background: var(--surface); color: var(--ink); resize: vertical; }
.save { font: inherit; font-weight: 600; background: var(--signal); color: var(--signal-ink); border: 1px solid #D9A80F; border-radius: 4px; padding: 6px 16px; cursor: pointer; min-height: 38px; }
.who { font-size: .85rem; color: var(--ink-soft); }
.err { color: var(--fail); font-size: .88rem; }
.hist { font-size: .82rem; color: var(--ink-soft); margin: 0; padding-left: 18px; }

/* lightbox */
.lightbox[hidden] { display: none; }
.lightbox { position: fixed; inset: 0; background: rgba(15, 21, 25, .88); display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 50; padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 12px; }
.lightbox-bar { display: flex; justify-content: space-between; align-items: center; color: #F4F6F3; gap: 12px; padding-bottom: 10px; }
.lightbox-bar button { font: inherit; background: var(--signal); color: #1F2A33; border: none; border-radius: 4px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
.lightbox-img { overflow: auto; display: grid; justify-items: center; align-items: start; }
.lightbox-img img { max-width: min(100%, 1280px); box-shadow: var(--shadow); border-radius: 4px; background: #fff; }

@media (max-width: 760px) {
  .band-inner { grid-template-columns: 1fr; }
  .verdict { text-align: left; }
  .case-head { grid-template-columns: auto minmax(0, 1fr); }
  .case-head .badge { grid-column: 1 / -1; justify-self: start; }
  .case-body { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="band">
  <div class="tape" aria-hidden="true"></div>
  <div class="wrap band-inner">
    <div>
      <h1 id="title">UAT ERP โรงงาน</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="verdict" aria-live="polite">
      <div class="big num" id="auto-score">–</div>
      <div class="lbl">กรณีทดสอบที่ระบบรันผ่านอัตโนมัติ</div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="summary">
    <div class="panel">
      <h2>ผลทดสอบอัตโนมัติก่อนส่ง UAT</h2>
      <p id="sys-line"></p>
      <table class="areas"><tbody id="areas"></tbody></table>
    </div>
    <div class="panel">
      <h2>ผลการทดสอบโดยผู้ใช้ (UAT)</h2>
      <p>ผู้ทดสอบทำตามขั้นตอนในแต่ละกรณีบนระบบจริง แล้วกดผลที่หน้านี้ ผลจะบันทึกไว้ให้ทุกคนที่เปิดหน้านี้เห็น</p>
      <div class="progress" id="progress" role="img" aria-label="ความคืบหน้า UAT"></div>
      <div class="legend" id="legend"></div>
      <div class="signoff" id="signoff" hidden>
        <div class="signoff-state" id="signoff-state"></div>
        <textarea id="signoff-note" placeholder="หมายเหตุการอนุมัติ (เช่น เงื่อนไขก่อนขึ้นใช้งานจริง)"></textarea>
        <div class="vbtns">
          <button type="button" class="vbtn" data-sign="approved" id="sign-approve">อนุมัติผล UAT</button>
          <button type="button" class="vbtn" data-sign="rejected" id="sign-reject">ยังไม่อนุมัติ</button>
        </div>
      </div>
      <p class="conn" id="conn">กำลังเชื่อมต่อที่เก็บผลทดสอบ…</p>
    </div>
  </section>

  <nav class="filters" aria-label="กรองกรณีทดสอบ" id="filters"></nav>
  <section class="cases" id="cases" aria-live="polite"></section>
</main>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="ภาพหน้าจอ">
  <div class="lightbox-bar"><span id="lb-caption"></span><button type="button" id="lb-close">ปิด</button></div>
  <div class="lightbox-img"><img id="lb-img" alt=""></div>
</div>

<script>
const DATA = /*__DATA__*/null;

const MODULE_TH = { identity: 'ผู้ใช้และสิทธิ์', 'master-data': 'ข้อมูลหลัก', inventory: 'คลังสินค้า', purchasing: 'จัดซื้อ', sales: 'ขาย', production: 'วางแผนการผลิต', maintenance: 'ซ่อมบำรุง', costing: 'ต้นทุน', automation: 'ระบบอัตโนมัติ', platform: 'แพลตฟอร์ม' };
const VERDICT = { pass: 'ผ่าน', fail: 'ไม่ผ่าน', blocked: 'ติดขัด' };
const RELEASE = 'v' + DATA.version;

let results = {};      // caseId -> {status, note, by, at, history}
let signoff = null;    // {decision, note, by, at}
let names = {};        // userId -> display name
let db = null, user = null, uid = null, canWrite = null;
let readOnly = false;
const filter = { module: 'all', state: 'all' };
const drafts = {};     // caseId -> note being typed

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
};
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString('th-TH-u-ca-buddhist', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch { return iso; } };
const who = (id) => (id && names[id]) || (id && id === uid ? 'คุณ' : 'ผู้ทดสอบ');

function renderHeader() {
  const passed = Object.values(DATA.auto).filter((a) => a.status === 'passed').length;
  $('auto-score').textContent = `${passed}/${DATA.cases.length}`;
  $('subtitle').textContent = `รุ่น ${DATA.version} สำหรับ ${DATA.company}` + (DATA.runAt ? `, รันอัตโนมัติเมื่อ ${fmtDate(DATA.runAt)}` : '');
  const s = DATA.system;
  $('sys-line').textContent = s.total ? `ผ่าน ${s.passed} จาก ${s.total} การทดสอบ ทั้ง unit, ทั้งระบบผ่าน gateway และผ่าน browser จริง` : 'ยังไม่มีผลทดสอบอัตโนมัติ';
  $('areas').replaceChildren(...s.rows.map((r) => el('tr', {}, el('td', { text: r.area }), el('td', { class: 'num' }, el('span', { class: r.passed === r.total ? 'pass-n' : 'fail-n', text: `${r.passed}/${r.total}` })))));
}

function counts() {
  const c = { pass: 0, fail: 0, blocked: 0, idle: 0 };
  for (const k of DATA.cases) c[results[k.id]?.status ?? 'idle']++;
  return c;
}

function renderProgress() {
  const c = counts();
  const n = DATA.cases.length;
  const seg = [['pass', 'var(--ok)'], ['fail', 'var(--fail)'], ['blocked', 'var(--warn)']];
  $('progress').replaceChildren(...seg.filter(([k]) => c[k]).map(([k, col]) => el('span', { style: `width:${(c[k] / n) * 100}%;background:${col}` })));
  $('progress').setAttribute('aria-label', `ผ่าน ${c.pass} ไม่ผ่าน ${c.fail} ติดขัด ${c.blocked} ยังไม่ทดสอบ ${c.idle} จาก ${n}`);
  $('legend').replaceChildren(
    el('span', {}, el('i', { style: 'background:var(--ok)' }), `ผ่าน ${c.pass}`),
    el('span', {}, el('i', { style: 'background:var(--fail)' }), `ไม่ผ่าน ${c.fail}`),
    el('span', {}, el('i', { style: 'background:var(--warn)' }), `ติดขัด ${c.blocked}`),
    el('span', {}, el('i', { style: 'background:var(--idle-bg);border:1px solid var(--rule)' }), `ยังไม่ทดสอบ ${c.idle}`),
  );
  if (db) {
    $('signoff').hidden = false;
    const done = c.idle === 0;
    $('signoff-state').textContent = signoff
      ? `${signoff.decision === 'approved' ? 'อนุมัติผล UAT แล้ว' : 'ยังไม่อนุมัติ'} โดย ${who(signoff.by)} เมื่อ ${fmtDate(signoff.at)}${signoff.note ? ` — ${signoff.note}` : ''}`
      : done ? 'ทดสอบครบทุกกรณีแล้ว พร้อมให้ผู้มีอำนาจอนุมัติ' : `ยังเหลือ ${c.idle} กรณีที่ยังไม่ทดสอบ`;
    $('sign-approve').disabled = readOnly || !done || c.fail > 0;
    $('sign-approve').title = c.fail > 0 ? 'ยังมีกรณีที่ไม่ผ่าน' : !done ? 'ทดสอบให้ครบทุกกรณีก่อน' : '';
    $('sign-reject').disabled = readOnly;
    for (const b of document.querySelectorAll('[data-sign]')) b.setAttribute('aria-pressed', String(signoff?.decision === b.dataset.sign));
  }
}

function renderFilters() {
  const mods = ['all', ...new Set(DATA.cases.map((c) => c.module))];
  const states = [['all', 'ทุกสถานะ'], ['idle', 'ยังไม่ทดสอบ'], ['pass', 'ผ่าน'], ['fail', 'ไม่ผ่าน'], ['blocked', 'ติดขัด']];
  const chip = (label, pressed, onclick) => el('button', { type: 'button', class: 'chip', 'aria-pressed': String(pressed), onclick, text: label });
  $('filters').replaceChildren(
    ...mods.map((m) => chip(m === 'all' ? 'ทุกโมดูล' : MODULE_TH[m] ?? m, filter.module === m, () => { filter.module = m; renderFilters(); renderCases(); })),
    el('span', { class: 'sep', 'aria-hidden': 'true' }),
    ...states.map(([k, label]) => chip(label, filter.state === k, () => { filter.state = k; renderFilters(); renderCases(); })),
  );
}

function badgeFor(status) {
  const map = { pass: ['b-pass', 'ผู้ใช้: ผ่าน'], fail: ['b-fail', 'ผู้ใช้: ไม่ผ่าน'], blocked: ['b-blocked', 'ผู้ใช้: ติดขัด'] };
  const [cls, label] = map[status] ?? ['b-idle', 'ยังไม่ทดสอบ'];
  return el('span', { class: `badge ${cls}`, text: label });
}

function caseCard(c) {
  const r = results[c.id];
  const a = DATA.auto[c.id];
  const shots = DATA.shots[c.id] ?? [];
  const autoText = a ? `ระบบรันอัตโนมัติ: ${a.status === 'passed' ? 'ผ่าน' : 'ไม่ผ่าน'} (${(a.ms / 1000).toFixed(1)} วินาที)` : 'ยังไม่มีผลรันอัตโนมัติ';

  const verdictRow = el('div', { class: 'verdict-row' });
  if (!db) {
    verdictRow.append(el('span', { class: 'who', text: 'บันทึกผลได้เมื่อเปิดหน้านี้บน claude.ai ขณะเข้าสู่ระบบ' }));
  } else {
    const note = el('textarea', { id: `note-${c.id}`, 'aria-label': `หมายเหตุ ${c.id}`, placeholder: 'หมายเหตุ เช่น สิ่งที่เห็นต่างจากผลที่คาดไว้', disabled: readOnly });
    note.value = drafts[c.id] ?? r?.note ?? '';
    note.addEventListener('input', () => { drafts[c.id] = note.value; });
    const errBox = el('span', { class: 'err', role: 'alert' });
    const btns = Object.entries(VERDICT).map(([v, label]) => el('button', {
      type: 'button', class: 'vbtn', 'data-v': v, 'aria-pressed': String(r?.status === v), disabled: readOnly,
      onclick: () => saveVerdict(c.id, v, note.value, errBox), text: label,
    }));
    const saveNote = el('button', { type: 'button', class: 'save', disabled: readOnly || !r, onclick: () => saveVerdict(c.id, r.status, note.value, errBox), text: 'บันทึกหมายเหตุ' });
    verdictRow.append(
      el('div', { class: 'vbtns' }, el('strong', { text: 'ผลที่ผู้ใช้ทดสอบ:' }), ...btns),
      note,
      el('div', { class: 'vbtns' }, saveNote, r ? el('span', { class: 'who', text: `บันทึกล่าสุดโดย ${who(r.by)} เมื่อ ${fmtDate(r.at)}` }) : null, errBox),
    );
    if (r?.history?.length > 1) {
      verdictRow.append(el('ul', { class: 'hist' }, ...r.history.slice(-5, -1).reverse().map((h) => el('li', { text: `${VERDICT[h.status] ?? h.status} — ${who(h.by)} ${fmtDate(h.at)}${h.note ? `: ${h.note}` : ''}` }))));
    }
  }

  return el('article', { class: 'case', id: c.id },
    el('div', { class: 'case-head' },
      el('span', { class: 'case-id', text: c.id }),
      el('div', {}, el('h2', { class: 'case-title', text: c.title }), el('div', { class: 'case-meta', text: `โมดูล${MODULE_TH[c.module] ?? c.module}, ผู้ทดสอบ: ${DATA.roles[c.role] ?? c.role}` })),
      badgeFor(r?.status),
    ),
    el('div', { class: 'case-body' },
      el('div', {},
        el('h3', { text: 'ขั้นตอน' }), el('ol', {}, ...c.steps.map((s) => el('li', { text: s }))),
        el('h3', { text: 'ผลที่คาดหวัง' }), el('ul', {}, ...c.expected.map((s) => el('li', { text: s }))),
        el('p', { class: 'auto', text: autoText }),
      ),
      el('div', { class: 'shots' }, ...shots.map((s, i) => el('button', {
        type: 'button', class: `shot ${s.device}`, onclick: () => openShot(c, i), 'aria-label': `ดูภาพหน้าจอ ${i + 1} ของ ${c.id}`,
      }, el('img', { src: `screens/${s.file}`, alt: `${c.id} ภาพที่ ${i + 1} (${s.device === 'phone' ? 'มือถือ' : 'คอมพิวเตอร์'})`, loading: 'lazy' }), el('span', { text: `ภาพที่ ${i + 1} (${s.device === 'phone' ? 'มือถือ' : 'คอมพิวเตอร์'})` })))),
    ),
    verdictRow,
  );
}

function renderCases() {
  const list = DATA.cases.filter((c) => (filter.module === 'all' || c.module === filter.module) && (filter.state === 'all' || (results[c.id]?.status ?? 'idle') === filter.state));
  $('cases').replaceChildren(...(list.length ? list.map(caseCard) : [el('p', { class: 'who', text: 'ไม่มีกรณีทดสอบตามตัวกรองนี้' })]));
}

function render() { renderProgress(); renderCases(); }

function openShot(c, i) {
  const s = DATA.shots[c.id][i];
  $('lb-img').src = `screens/${s.file}`;
  $('lb-img').alt = `${c.id} ${c.title} ภาพที่ ${i + 1}`;
  $('lb-caption').textContent = `${c.id} ${c.title} — ภาพที่ ${i + 1}/${DATA.shots[c.id].length}`;
  $('lightbox').hidden = false;
  $('lb-close').focus();
}
$('lb-close').addEventListener('click', () => { $('lightbox').hidden = true; });
$('lightbox').addEventListener('click', (e) => { if (e.target === $('lightbox') || e.target.classList.contains('lightbox-img')) $('lightbox').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lightbox').hidden = true; });

async function saveVerdict(caseId, status, note, errBox) {
  if (!db || readOnly) return;
  errBox.textContent = '';
  const prev = results[caseId];
  const entry = { status, note: note.trim(), by: uid, at: new Date().toISOString() };
  const history = [...(prev?.history ?? []), entry].slice(-20);
  try {
    await db.doc(`results/${caseId}`).set({ ...entry, history });
    delete drafts[caseId];
  } catch (e) {
    if (e?.code === 'invalid_argument') { readOnly = true; render(); errBox.textContent = 'บัญชีนี้ดูผลได้อย่างเดียว ขอสิทธิ์ผู้ร่วมแก้ไขจากเจ้าของหน้านี้'; }
    else errBox.textContent = 'บันทึกไม่สำเร็จ ลองอีกครั้ง';
  }
}

async function saveSignoff(decision) {
  if (!db || readOnly) return;
  try {
    await db.doc(`signoff/${RELEASE}`).set({ decision, note: $('signoff-note').value.trim(), by: uid, at: new Date().toISOString() });
  } catch (e) {
    $('signoff-state').textContent = e?.code === 'invalid_argument' ? 'บัญชีนี้อนุมัติไม่ได้' : 'บันทึกไม่สำเร็จ ลองอีกครั้ง';
  }
}
$('sign-approve').addEventListener('click', () => saveSignoff('approved'));
$('sign-reject').addEventListener('click', () => saveSignoff('rejected'));

async function resolveNames() {
  if (!user) return;
  const ids = [...new Set([...Object.values(results).flatMap((r) => [r.by, ...(r.history ?? []).map((h) => h.by)]), signoff?.by].filter(Boolean))];
  if (!ids.length) return;
  const ps = await user.profiles(ids);
  let changed = false;
  for (const id of ids) { const n = ps?.[id]?.name || ''; if (n && names[id] !== n) { names[id] = n; changed = true; } }
  if (changed) render();
}

async function connect() {
  if (!window.claude?.use) { $('conn').textContent = 'เปิดหน้านี้บน claude.ai เพื่อบันทึกผลทดสอบ'; return; }
  [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db) { $('conn').textContent = 'เข้าสู่ระบบ claude.ai เพื่อบันทึกผลทดสอบ ตอนนี้ดูได้อย่างเดียว'; render(); return; }
  uid = user ? await user.id() : null;
  canWrite = user ? await user.can('data.write') : null;
  readOnly = canWrite === false || !uid;
  $('conn').textContent = readOnly ? 'บัญชีนี้ดูผลได้อย่างเดียว ขอสิทธิ์ผู้ร่วมแก้ไขเพื่อบันทึกผล' : 'บันทึกผลได้ ผลของทุกคนอัปเดตทันที';
  db.collection('results').onSnapshot((snap) => {
    const next = {};
    for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
    results = next;
    render();
    resolveNames();
  }, () => { $('conn').textContent = 'การเชื่อมต่อขาดหาย โหลดหน้าใหม่เพื่อดูผลล่าสุด'; });
  db.doc(`signoff/${RELEASE}`).onSnapshot((d) => {
    signoff = d.exists ? d.data() : null;
    if (signoff?.note && !$('signoff-note').value) $('signoff-note').value = signoff.note;
    renderProgress();
    resolveNames();
  });
  render();
}

renderHeader();
renderFilters();
render();
connect();
</script>
